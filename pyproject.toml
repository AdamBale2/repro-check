[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "repro-check"
dynamic = ["version"]
description = "Run the reproduction example from a bug report in an isolated container and report whether it fails."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["github-action", "triage", "bug-report", "reproduction", "maintainers"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
repro-check = "repro_check.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "src/repro_check/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/repro_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a working Docker daemon and network access"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
